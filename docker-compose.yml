version: '3.8'

services:
  # ----------------------------------------
  # Database Service (MySQL)
  # ----------------------------------------
  db:
    image: mysql:8.0
    container_name: vip_phone_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: phone_store
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      # เพื่อให้ข้อมูลเก่ามาด้วย (ถ้ามี) ให้เอาไฟล์ phone_store.sql ไปใส่ในโฟลเดอร์ init-db แล้วลบคอมเมนต์บรรทัดล่างออก
      # - ./init-db:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password

  # ----------------------------------------
  # Backend Service (Node.js + Express)
  # ----------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vip_phone_backend
    restart: always
    depends_on:
      - db
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=rootpassword
      - DB_NAME=phone_store
      - JWT_SECRET=your_super_secret_jwt_key
      - PORT=5000
    volumes:
      - ./backend/uploads:/app/uploads

  # ----------------------------------------
  # Frontend Service (Vue.js + Nginx)
  # ----------------------------------------
  frontend:
    build: 
      context: .
      dockerfile: Dockerfile
      args:
        # กำหนดให้ API เรียกไปที่ URL เดียวกับหน้าเว็บ เพื่อให้ Nginx จัดการ Proxy ต่อ
        - VITE_API_URL=
    container_name: vip_phone_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  db_data:
