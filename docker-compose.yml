version: "3"
services:
  db:
    image: mysql:8.0
    container_name: vip_phone_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: phone_store
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
  backend:
    build:
      # เปลี่ยนเป็น Path เต็มบน NAS
      context: /share/docker/mobile_store/backend
      dockerfile: Dockerfile
    container_name: vip_phone_backend
    restart: always
    depends_on:
      - db
    ports:
      - "5001:5000"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=phone_store
      - JWT_SECRET=your_super_secret_jwt_key
      - PORT=5000
    volumes:
      # เปลี่ยนเป็น Path เต็มบน NAS
      - /share/docker/mobile_store/backend/uploads:/app/uploads
  frontend:
    build: 
      # เปลี่ยนเป็น Path เต็มบน NAS
      context: /share/docker/mobile_store
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=
    container_name: vip_phone_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "8082:80"
volumes:
  db_data: